name: HDR diagnostic Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/hdr-minimal-opengl

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create embed placeholders (diagnostic mode does not read game assets)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.MAP | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.001 | Out-Null
      - name: Build Windows diagnostic
        run: go build -o JohnnyHDRDiagnostic.exe .
      - name: Upload diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: Johnny-HDR-Diagnostic-Windows
          path: JohnnyHDRDiagnostic.exe
          retention-days: 7
