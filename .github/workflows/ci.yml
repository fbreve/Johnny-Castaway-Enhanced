name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder proprietary assets for compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.MAP | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.001 | Out-Null

      - name: Run tests
        run: go test ./...

  race:
    name: Go race tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder proprietary assets for compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.MAP | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.001 | Out-Null

      - name: Run race detector
        run: go test -race ./...
