name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder proprietary assets for compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.MAP | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.001 | Out-Null

      - name: Run tests
        run: go test ./...

  race:
    name: Go race tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder proprietary assets for compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.MAP | Out-Null
          New-Item -ItemType File -Force assets/RESOURCE.001 | Out-Null

      - name: Run race detector
        run: go test -race ./...


  linux:
    name: Go tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install raylib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder proprietary assets for compilation
        run: |
          mkdir -p assets
          touch assets/RESOURCE.MAP assets/RESOURCE.001

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
